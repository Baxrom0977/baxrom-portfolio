<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>22 Calendar app</title>
  </head>
  <body>
    <div class="calendar">
      <div class="calendarHeader">
        <button class="prevBtn">←</button>

        <h2 class="monthYear"></h2>

        <button class="nextBtn">→</button>
      </div>

      <div class="weekdays">
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div>Sat</div>
        <div>Sun</div>
      </div>

      <div class="days">
        <!-- Days will be created with JavaScript -->
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
