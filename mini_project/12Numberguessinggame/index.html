<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>21 Number guessing game</title>
  </head>
  <body>
    <div class="game">
      <h1>🎯 Number Guessing Game</h1>

      <p class="description">Guess a number between 1 and 100</p>

      <input
        type="number"
        class="guessInput"
        placeholder="Enter your number"
        min="1"
        max="100"
      />

      <button class="guessBtn">Guess</button>

      <p class="message">Start guessing!</p>

      <p>Attempts: <span class="attempts">0</span></p>

      <button class="resetBtn">New Game</button>
    </div>
    

    <script src="script.js"></script>
  </body>
</html>
