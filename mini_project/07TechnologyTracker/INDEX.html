<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style.css" />

    <title>Трекер технологий</title>
  </head>

  <body>
    <h1>Трекер технологий</h1>

    <input
      class="techInput"
      type="text"
      placeholder="Введите название технологии"
    />

    <input
      class="descriptionInput"
      type="text"
      placeholder="Введите описание"
    />

    <button class="addBtn" type="button">Добавить технологию</button>

    <h2>Список технологий</h2>

    <p class="countTech"></p>
    <p class="learnedcountTech"></p>

    <div class="techList"></div>

    <script src="script.js"></script>
  </body>
</html>
