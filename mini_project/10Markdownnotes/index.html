<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Markdown заметки</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <h1>Markdown заметки 📝</h1>

      <input class="titleInput" type="text" placeholder="Название заметки" />

      <textarea class="noteInput" placeholder="Напишите заметку..."></textarea>

      <button class="addBtn" type="button">Добавить заметку</button>

      <input class="searchInput" type="text" placeholder="Поиск заметок..." />

      <div class="notesList"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
