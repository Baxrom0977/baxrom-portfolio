<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Finance Dashboard</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="dashboard">
      <header class="header">
        <div>
          <p class="subtitle">Personal Finance</p>
          <h1>Finance Dashboard</h1>
        </div>

        <div class="header-date">
          <span>My finances</span>
        </div>
      </header>

      <main>
        <!-- STATISTICS -->

        <section class="stats">
          <div class="stat-card balance-card">
            <p>Total Balance</p>
            <h2 id="balance">$0</h2>
          </div>

          <div class="stat-card">
            <p>Income</p>
            <h2 id="income">$0</h2>
          </div>

          <div class="stat-card">
            <p>Expenses</p>
            <h2 id="expenses">$0</h2>
          </div>
          <div class="stat-card">
            <p>Spent</p>
            <h2 id="spent-percent">0%</h2>
          </div>
        </section>

        <!-- FORM -->

        <section class="panel">
          <div class="panel-title">
            <div>
              <p class="subtitle">Transaction</p>
              <h2>Add Transaction</h2>
            </div>
          </div>

          <form id="transaction-form" class="transaction-form">
            <div class="form-group">
              <label for="title">Title</label>

              <input type="text" id="title" placeholder="Example: Salary" />
            </div>

            <div class="form-group">
              <label for="amount">Amount</label>

              <input type="number" id="amount" placeholder="0" />
            </div>

            <div class="form-group">
              <label for="type">Type</label>

              <select id="type">
                <option value="income">Income</option>
                <option value="expense">Expense</option>
              </select>
            </div>

            <div class="form-group">
              <label for="category">Category</label>

              <select id="category">
                <option value="salary">Salary</option>
                <option value="food">Food</option>
                <option value="rent">Rent</option>
                <option value="transport">Transport</option>
                <option value="shopping">Shopping</option>
                <option value="other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="date">Date</label>

              <input type="date" id="date" />
            </div>

            <button class="add-btn" type="submit">Add Transaction</button>
          </form>
        </section>

        <!-- CHART -->

        <section class="panel">
          <div class="panel-title">
            <div>
              <p class="subtitle">Overview</p>
              <h2>Income & Expenses</h2>
            </div>
          </div>

          <div class="chart" id="chart">
            <p>Chart will appear here</p>
          </div>
        </section>

        <!-- CATEGORY ANALYSIS -->

        <section class="panel category-analysis">
          <div class="panel-title">
            <div>
              <p class="subtitle">Analysis</p>
              <h2>Expenses by Category</h2>
            </div>
          </div>

          <div id="category-stats"></div>
        </section>

        <section class="panel monthly-summary ">
          <div class="panel-title">
            <div>
              <p class="subtitle">Monthly Analytics</p>
              <h2>Monthly Summary</h2>
            </div>
          </div>

          <div id="monthly-stats" class="monthly-stats"></div>
        </section>
        <!-- TRANSACTIONS -->

        <section class="panel transactions-panel">
          <div class="transactions-header">
            <div>
              <p class="subtitle">History</p>
              <h2>Transactions</h2>
            </div>

            <div class="filters">
              <button class="filter-btn active" data-filter="all" type="button">
                All
              </button>

              <button class="filter-btn" data-filter="income" type="button">
                Income
              </button>

              <button class="filter-btn" data-filter="expense" type="button">
                Expenses
              </button>
              <div class="date-range">
                <div class="date-field">
                  <label for="date-from">From</label>
                  <input type="date" id="date-from" />
                </div>

                <div class="date-field">
                  <label for="date-to">To</label>
                  <input type="date" id="date-to" />
                </div>
              </div>
            </div>
          </div>

          <div id="transactions-list" class="transactions-list">
            <div class="empty">No transactions yet</div>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
